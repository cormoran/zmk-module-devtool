CONFIG_GPIO=n
CONFIG_ZMK_BLE=n
CONFIG_LOG=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_ZMK_LOG_LEVEL_DBG=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_DEVTOOL=y
CONFIG_ZMK_DEVTOOL_STUDIO_RPC=y
CONFIG_ZMK_DEVTOOL_LAYER_STATE=y
CONFIG_ZMK_DEVTOOL_KEY_INJECTION=y
CONFIG_ZMK_DEVTOOL_EVENT_TAP=y
CONFIG_ZMK_DEVTOOL_LOG_CAPTURE=y
CONFIG_ZMK_DEVTOOL_STUDIO_RPC_TEST=y
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=128
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=96
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_PRINT_LIST_ON_START=y

# get_events/get_logs responses (up to 6 events / 3 log records) need more
# than the default 64-byte TX buffer -- see the BUILD_ASSERTs in
# src/studio/devtool_events.c and src/studio/devtool_logs.c.
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=384

CONFIG_GPIO=n
CONFIG_ZMK_BLE=n
CONFIG_LOG=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_ZMK_LOG_LEVEL_DBG=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_DEVTOOL=y
CONFIG_ZMK_DEVTOOL_STUDIO_RPC=y
CONFIG_ZMK_DEVTOOL_LAYER_STATE=y
CONFIG_ZMK_DEVTOOL_KEY_INJECTION=y
CONFIG_ZMK_DEVTOOL_EVENT_TAP=y
CONFIG_ZMK_DEVTOOL_LOG_CAPTURE=y
CONFIG_ZMK_DEVTOOL_STACK_USAGE=y
# Short poll interval so the streaming self-test observes delivery within the
# mock keyboard's brief run before native_sim exits.
CONFIG_ZMK_DEVTOOL_LOG_CAPTURE_STREAM_INTERVAL_MS=5
# Tiny cap (one batch) so the streaming self-test drives the per-invocation
# ceiling + immediate K_NO_WAIT re-enqueue path under the mock keyboard's log
# flood, and confirms delivery still completes across those re-enqueues.
CONFIG_ZMK_DEVTOOL_LOG_CAPTURE_STREAM_MAX_RECORDS_PER_WORK=3
CONFIG_ZMK_DEVTOOL_STUDIO_RPC_TEST=y
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=128
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=96
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_PRINT_LIST_ON_START=y

# Larger than the 64-byte default so multi-record get_events/get_logs replies
# stream out with fewer backpressure sleeps (a throughput choice, not a
# correctness one -- the transport streams responses of any size).
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=384
